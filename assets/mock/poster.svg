<svg xmlns="http://www.w3.org/2000/svg" width="400" height="600" viewBox="0 0 400 600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1030"/>
      <stop offset="1" stop-color="#1c2b5e"/>
    </linearGradient>
    <radialGradient id="moonglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.6" stop-color="#f4e9c8"/>
      <stop offset="1" stop-color="#d8c68f"/>
    </radialGradient>
  </defs>
  <rect width="400" height="600" fill="url(#sky)"/>
  <g fill="#ffffff" opacity="0.8">
    <circle cx="60" cy="90" r="2"/><circle cx="330" cy="60" r="2.5"/>
    <circle cx="120" cy="200" r="1.5"/><circle cx="290" cy="180" r="2"/>
    <circle cx="40" cy="300" r="2"/><circle cx="350" cy="290" r="1.5"/>
    <circle cx="90" cy="420" r="2"/><circle cx="310" cy="410" r="2"/>
    <circle cx="200" cy="70" r="1.5"/><circle cx="250" cy="330" r="1.5"/>
  </g>
  <circle cx="200" cy="250" r="110" fill="url(#moonglow)"/>
  <g fill="#c9b476" opacity="0.55">
    <circle cx="160" cy="210" r="18"/><circle cx="245" cy="270" r="13"/>
    <circle cx="200" cy="310" r="9"/><circle cx="240" cy="195" r="7"/>
  </g>
  <!-- capsule stuck in the moon's eye -->
  <g transform="rotate(35 258 216)">
    <rect x="250" y="186" width="16" height="52" rx="8" fill="#8a93a6"/>
    <polygon points="258,176 250,192 266,192" fill="#aab3c5"/>
  </g>
  <text x="200" y="490" text-anchor="middle" font-family="Noto Sans, sans-serif"
        font-size="34" font-weight="700" fill="#f4e9c8" letter-spacing="2">A TRIP TO</text>
  <text x="200" y="532" text-anchor="middle" font-family="Noto Sans, sans-serif"
        font-size="34" font-weight="700" fill="#f4e9c8" letter-spacing="2">THE MOON</text>
  <text x="200" y="566" text-anchor="middle" font-family="Noto Sans, sans-serif"
        font-size="17" fill="#9aa4c4" letter-spacing="4">1902</text>
</svg>
