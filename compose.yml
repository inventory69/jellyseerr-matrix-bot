services:
  jellyseerr-matrix-bot:
    image: ghcr.io/inventory69/jellyseerr-matrix-bot:latest
    container_name: jellyseerr-matrix-bot
    restart: unless-stopped
    env_file: config.env
    volumes:
      # The crypto store MUST persist, otherwise the bot shows up as a new
      # Matrix device on every restart and old messages become undecryptable.
      - store:/data/store
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/metrics')"]
      interval: 60s
      timeout: 5s
      retries: 3
    # The bot listens on container port 8080 (/webhook and /metrics). Put a
    # reverse proxy in front of it instead of publishing the port directly;
    # the webhook secret is the only authentication.
    # ports:
    #   - "8080:8080"

volumes:
  store:
